<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4F6C" />
      <stop offset="50%" stop-color="#0E3A52" />
      <stop offset="100%" stop-color="#1E8E5A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E8E5A" />
      <stop offset="100%" stop-color="#157347" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2" stroke-dasharray="8 6" />

  <!-- Central Shield -->
  <g filter="url(#shadow)">
    <!-- Shield Base Shape -->
    <path d="M 256,90 L 370,140 C 370,265 295,350 256,385 C 217,350 142,265 142,140 Z" fill="#0E2A3A" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />

    <!-- Sierra Leone National Tri-Color Stripes Inside Shield -->
    <clipPath id="shieldClip">
      <path d="M 256,92 L 366,140 C 366,263 293,346 256,380 C 219,346 146,263 146,140 Z" />
    </clipPath>

    <g clip-path="url(#shieldClip)">
      <!-- Green Band -->
      <rect x="130" y="90" width="252" height="75" fill="#1E8E5A" />
      <!-- White Band -->
      <rect x="130" y="165" width="252" height="60" fill="#FFFFFF" />
      <!-- Navy Blue Band -->
      <rect x="130" y="225" width="252" height="160" fill="#0B4F6C" />
      
      <!-- Emblem Center Star / Passport Beacon -->
      <polygon points="256,165 264,188 288,188 269,202 276,225 256,211 236,225 243,202 224,188 248,188" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.5" />
    </g>
  </g>

  <!-- Golden Stars & Laurel Wreath Accents -->
  <circle cx="256" cy="415" r="7" fill="url(#goldGrad)" />
  <circle cx="230" cy="412" r="5" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="282" cy="412" r="5" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Typography: SLID -->
  <text x="256" y="462" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="8" fill="#FFFFFF">
    SLID
  </text>
  <text x="256" y="484" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="url(#goldGrad)">
    IMMIGRATION
  </text>
</svg>
