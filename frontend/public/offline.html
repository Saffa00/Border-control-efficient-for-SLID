<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Offline — SLID Portal</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
        background-color: #F8F7F4;
        color: #1F2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid #E5E0D8;
        border-radius: 20px;
        padding: 40px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 12px 36px rgba(11, 79, 108, 0.08);
      }
      .icon-box {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #0B4F6C 0%, #1E8E5A 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FFFFFF;
        font-size: 32px;
        box-shadow: 0 8px 20px rgba(30, 142, 90, 0.25);
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #0B4F6C;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      .tag {
        display: inline-block;
        background: #FEF3C7;
        color: #B45309;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 16px;
        border: 1px solid #FDE68A;
      }
      p {
        font-size: 14px;
        color: #6B7280;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #1E8E5A;
        color: #FFFFFF;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(30, 142, 90, 0.3);
      }
      .btn:hover {
        background: #157347;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .sub-strip {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px dashed #E5E7EB;
        font-size: 11px;
        color: #9CA3AF;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">📡</div>
      <span class="tag">Offline Mode</span>
      <h1>No Internet Connection</h1>
      <p>
        The Sierra Leone Immigration Portal is running in standalone mode. Cached records and passes remain available, but live network requests require an active connection.
      </p>
      <button class="btn" onclick="window.location.reload()">
        ↻ Retry Connection
      </button>
      <div class="sub-strip">
        Sierra Leone Immigration & Border Management System
      </div>
    </div>
  </body>
</html>
