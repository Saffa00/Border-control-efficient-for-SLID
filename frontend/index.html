<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Native App Viewport & Safe-Area Insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Title & Description -->
    <title>Sierra Leone Immigration Management System (SLID)</title>
    <meta name="description" content="Official Government Progressive Web App for Sierra Leone e-Visa applications, passport clearance, and border control." />

    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SLID Portal" />
    <meta name="application-name" content="SLID Portal" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#1E8E5A" />
    <meta name="msapplication-TileColor" content="#0B4F6C" />
    <meta name="msapplication-navbutton-color" content="#1E8E5A" />

    <!-- Icons & Apple Touch Icons -->
    <link rel="icon" type="image/png" href="/slid-logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/slid-logo.png" color="#1E8E5A" />

    <!-- Google Fonts: Fraunces, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-ink font-body antialiased min-h-screen select-none sm:select-auto overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
